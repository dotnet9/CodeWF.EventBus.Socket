name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore CodeWF.EventBus.Socket.slnx

      - name: Test
        run: dotnet test src/CodeWF.EventBus.Socket.Test/CodeWF.EventBus.Socket.Test.csproj --no-restore --verbosity minimal

      - name: Pack library
        run: dotnet pack src/CodeWF.EventBus.Socket/CodeWF.EventBus.Socket.csproj --no-restore --configuration Release --output artifacts/packages
